name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Local install smoke test
        run: |
          cargo install --path . --locked --debug --force --root target/install-root
          target/install-root/bin/fathrs --version

      - name: Git install smoke test
        run: |
          cargo install --git https://github.com/sguzman/fathrs --rev "$GITHUB_SHA" --locked --debug --force --root target/git-install-root
          target/git-install-root/bin/fathrs --version

      - name: Format
        run: cargo fmt --check
