name: Format once

on:
  push:
    branches:
      - main
    paths:
      - FORMAT_NOW

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and commit rustfmt
        run: |
          cargo fmt
          rm -f FORMAT_NOW .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply release rustfmt"
            git push
          fi
