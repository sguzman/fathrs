name: Publish tagged executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select newest locally-authorized version tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git tag --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable Rust
        if: steps.release.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build exact tagged source
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git worktree add --detach tagged-release "$TAG"
          cargo build --manifest-path tagged-release/Cargo.toml --release --locked
          mkdir -p dist
          tar -C tagged-release/target/release -cJf "dist/fathrs-$TAG-x86_64-linux.tar.xz" fathrs

      - name: Create GitHub Release and attach executable archive
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG"             "dist/fathrs-$TAG-x86_64-linux.tar.xz"             --repo "$GITHUB_REPOSITORY"             --title "fathrs $TAG"             --notes "Executable archive built from the exact locally-authorized $TAG source. See CHANGELOG.md and docs/VERSIONING.md for release semantics."
